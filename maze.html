<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sukhothai Choice Path</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; background-color: #2C2B29; margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; color: #F5F2EB;}
        .header { text-align: center; margin-bottom: 10px; width: 100%; max-width: 380px;}
        .header h2 { color: #D4AF37; margin: 0 0 5px 0; font-size: 1.5rem; }
        .header p { color: #F5F2EB; margin: 0; font-size: 0.85rem; }
        
        .game-card { background: white; color: #2C2B29; width: 100%; max-width: 380px; border-radius: 16px; padding: 15px; box-shadow: 0 8px 20px rgba(0,0,0,0.5); box-sizing: border-box; text-align: center;}
        
        .status-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; font-weight: bold; background: #f0f0f0; padding: 8px 15px; border-radius: 8px;}
        .hp-bar { color: #E53E3E; font-size: 1.2rem; letter-spacing: 2px;}
        
        /* พื้นที่แผนที่ 2D */
        .map-container {
            position: relative; width: 240px; height: 380px; background: #8C705F; 
            margin: 0 auto 15px auto; border-radius: 12px; border: 4px solid #D4AF37;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.5); overflow: hidden;
        }

        .grid-cell { position: absolute; width: 33.33%; height: 14.28%; display: flex; align-items: center; justify-content: center; }
        
        .block { width: 80%; height: 80%; background: #F5F2EB; border-radius: 8px; box-shadow: 0 4px 0 #cfcabe; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; z-index: 1; transition: all 0.3s;}
        .block.event { background: #FFF9E6; border: 2px dashed #D4AF37; box-shadow: 0 4px 0 #D4AF37; color: #D4AF37; font-weight: bold;}
        .block.door { background: #E5E7EB; box-shadow: 0 4px 0 #D1D5DB; color: #8C705F; }
        .block.dead { background: #FDE8E8; box-shadow: 0 4px 0 #F56565; color: #C53030; opacity: 0.9;}
        .block.start { background: #EBF8FF; box-shadow: 0 4px 0 #90CDF4; }
        .block.goal { background: #D4AF37; box-shadow: 0 4px 0 #B59223; color: white; }

        /* ตัวผู้เล่น */
        .player {
            position: absolute; width: 35px; height: 35px; background: #B24C38;
            border-radius: 50%; border: 3px solid white; box-shadow: 0 4px 8px rgba(0,0,0,0.6);
            z-index: 10; transition: all 0.5s ease-in-out; transform: translate(-50%, -50%);
        }

        .btn-walk { background: #B24C38; color: white; border: none; padding: 12px; border-radius: 8px; font-family: 'Prompt'; font-size: 1.1rem; font-weight: bold; width: 100%; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 6px rgba(178,76,56,0.3); }
        .btn-walk:active { transform: scale(0.95); }

        /* Popup คำถาม */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; z-index: 100; padding: 15px; box-sizing: border-box;}
        .modal-content { background: white; width: 100%; max-width: 340px; padding: 20px; border-radius: 12px; text-align: center; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .modal-title { color: #B24C38; font-size: 1.2rem; font-weight: bold; margin-bottom: 5px; }
        .modal-q { font-size: 1rem; margin-bottom: 20px; color: #333; font-weight: 600; min-height: 45px;}
        .choices { display: flex; gap: 10px; }
        .btn-choice { flex: 1; background: #F5F2EB; border: 2px solid #E5E7EB; padding: 10px; border-radius: 12px; font-family: 'Prompt'; font-size: 0.9rem; font-weight: bold; cursor: pointer; transition: 0.2s; color: #2C2B29; line-height: 1.4;}
        .btn-choice:active { transform: scale(0.95); background: #E5E7EB; }
        .btn-left { border-left-color: #3182CE; border-left-width: 4px; }
        .btn-right { border-right-color: #48BB78; border-right-width: 4px; }
        .dir-icon { font-size: 1.2rem; display: block; margin-bottom: 5px; color: #888; }
        
        #msg-toast { color: #B24C38; font-weight: bold; margin-bottom: 10px; min-height: 25px; }
    </style>
</head>
<body>

    <div class="header">
        <h2>🧭 เขาวงกตทางเลือก</h2>
        <p>เดินชนคำถาม แล้วเลือกทางแยก ซ้าย/ขวา ให้ถูกต้อง!</p>
    </div>

    <div class="game-card">
        <div class="status-bar">
            <div>ด่าน: <span id="stage-text">1/3</span></div>
            <div class="hp-bar" id="hp">❤️❤️❤️</div>
        </div>

        <div class="map-container" id="map-container">
            <!-- จุดต่างๆ จะถูกวาดที่นี่ -->
            <div class="player" id="player"></div>
        </div>

        <div id="msg-toast">กดปุ่มเริ่มเดินทาง เพื่อเดินไปที่จุด ❓</div>
        <button class="btn-walk" id="btn-walk" onclick="startWalking()">🚶 เริ่มเดินทาง</button>
    </div>

    <div class="modal-overlay" id="question-modal">
        <div class="modal-content">
            <div class="modal-title">ด่านคำถาม! ❓</div>
            <div class="modal-q" id="q-text">คำถาม?</div>
            <div class="choices">
                <button class="btn-choice btn-left" onclick="makeChoice('left')">
                    <span class="dir-icon">⬅️ ซ้าย</span>
                    <span id="choice-left">ตัวเลือก A</span>
                </button>
                <button class="btn-choice btn-right" onclick="makeChoice('right')">
                    <span class="dir-icon">ขวา ➡️</span>
                    <span id="choice-right">ตัวเลือก B</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        // โครงสร้างแผนที่ 2D - ซ่อนคำตอบไว้หลังประตู (🚪)
        const initialMapBlocks = [
            { r: 6, c: 1, icon: '📍', type: 'start' },
            { r: 5, c: 1, icon: '❓', type: 'event' },
            { r: 4, c: 0, icon: '🚪', type: 'door' }, // ซ้ายด่าน 1
            { r: 4, c: 2, icon: '🚪', type: 'door' }, // ขวาด่าน 1
            { r: 3, c: 1, icon: '❓', type: 'event' },
            { r: 2, c: 0, icon: '🚪', type: 'door' }, // ซ้ายด่าน 2
            { r: 2, c: 2, icon: '🚪', type: 'door' }, // ขวาด่าน 2
            { r: 1, c: 1, icon: '❓', type: 'event' },
            { r: 0, c: 0, icon: '🚪', type: 'door' }, // ซ้ายด่าน 3
            { r: 0, c: 2, icon: '🚪', type: 'door' }  // ขวาด่าน 3
        ];

        const stages = [
            { 
                q: "สระน้ำที่ขุดขึ้นเพื่อกักเก็บน้ำอุปโภคบริโภคเรียกว่าอะไร?", 
                left: { text: "สรีดภงส์", r: 4, c: 0, isCorrect: false },
                right: { text: "ตระพัง", r: 4, c: 2, isCorrect: true },
                nextR: 3, nextC: 1 
            },
            { 
                q: "เครื่องปั้นดินเผาที่เป็นสินค้าส่งออกสำคัญคืออะไร?", 
                left: { text: "เครื่องสังคโลก", r: 2, c: 0, isCorrect: true },
                right: { text: "เครื่องเบญจรงค์", r: 2, c: 2, isCorrect: false },
                nextR: 1, nextC: 1
            },
            { 
                q: "กษัตริย์พระองค์ใดเป็นผู้ประดิษฐ์อักษรลายสือไทย?", 
                left: { text: "พระมหาธรรมราชา", r: 0, c: 0, isCorrect: false },
                right: { text: "พ่อขุนรามคำแหง", r: 0, c: 2, isCorrect: true },
                nextR: 0, nextC: 2
            }
        ];

        let currentStage = 0;
        let hp = 3;
        let isMoving = false;
        let gameActive = true;
        let mapBlocks = [];

        function drawMap() {
            const container = document.getElementById('map-container');
            container.innerHTML = '<div class="player" id="player"></div>'; // รีเซ็ตกระดาน
            
            mapBlocks = JSON.parse(JSON.stringify(initialMapBlocks)); // ก๊อปปี้บล็อกเริ่มต้น
            
            mapBlocks.forEach(b => {
                const cell = document.createElement('div');
                cell.className = 'grid-cell';
                cell.style.top = (b.r * 14.28) + '%';
                cell.style.left = (b.c * 33.33) + '%';
                // กำหนด ID ให้บล็อกเพื่อให้แก้ไอคอนได้ง่าย
                cell.innerHTML = `<div id="block-${b.r}-${b.c}" class="block ${b.type}">${b.icon}</div>`;
                container.appendChild(cell);
            });
            container.appendChild(document.getElementById('player'));
        }

        function setPlayerPos(r, c) {
            const p = document.getElementById('player');
            p.style.top = (r * 14.28 + 7.14) + '%';
            p.style.left = (c * 33.33 + 16.66) + '%';
        }

        function updateUI() {
            document.getElementById('hp').innerText = '❤️'.repeat(hp);
            if(currentStage < stages.length) {
                document.getElementById('stage-text').innerText = `${currentStage + 1}/${stages.length}`;
            }
        }

        function initGame() {
            currentStage = 0; hp = 3; gameActive = true; isMoving = false;
            drawMap();
            updateUI();
            setPlayerPos(6, 1); 
            document.getElementById('msg-toast').innerText = 'กดปุ่มเริ่มเดินทาง เพื่อเดินไปที่จุด ❓';
            document.getElementById('msg-toast').style.color = '#B24C38';
            document.getElementById('btn-walk').innerText = '🚶 เริ่มเดินทาง';
            document.getElementById('btn-walk').onclick = startWalking;
        }

        function startWalking() {
            if(isMoving || !gameActive) return;
            isMoving = true;
            document.getElementById('btn-walk').style.display = 'none';
            document.getElementById('msg-toast').innerText = 'กำลังเดิน...';
            
            const qRow = (currentStage === 0) ? 5 : (currentStage === 1) ? 3 : 1;
            setPlayerPos(qRow, 1);

            setTimeout(() => { showQuestion(); }, 600);
        }

        function showQuestion() {
            const stg = stages[currentStage];
            document.getElementById('q-text').innerText = stg.q;
            document.getElementById('choice-left').innerText = stg.left.text;
            document.getElementById('choice-right').innerText = stg.right.text;
            document.getElementById('question-modal').style.display = 'flex';
        }

        function makeChoice(direction) {
            document.getElementById('question-modal').style.display = 'none';
            const stg = stages[currentStage];
            const choiceData = (direction === 'left') ? stg.left : stg.right;

            // เดินไปเปิดประตูทางที่เลือก
            setPlayerPos(choiceData.r, choiceData.c);
            
            setTimeout(() => {
                const blockEl = document.getElementById(`block-${choiceData.r}-${choiceData.c}`);
                
                if(choiceData.isCorrect) {
                    // เปลี่ยนประตูเป็นทางเดินสว่าง/ธงชัย
                    blockEl.innerText = (currentStage === stages.length - 1) ? '🏁' : '✨';
                    blockEl.className = 'block goal';

                    document.getElementById('msg-toast').innerText = '✅ ถูกต้อง! เส้นทางเปิดออก';
                    document.getElementById('msg-toast').style.color = '#48BB78';
                    
                    setTimeout(() => {
                        setPlayerPos(stg.nextR, stg.nextC); // เดินไปด่านต่อไป
                        setTimeout(() => {
                            currentStage++;
                            updateUI();
                            if(currentStage >= stages.length) {
                                document.getElementById('msg-toast').innerText = '🏆 ยินดีด้วย! คุณหาทางออกสำเร็จ';
                                gameActive = false;
                                document.getElementById('btn-walk').innerText = 'เล่นใหม่อีกครั้ง';
                                document.getElementById('btn-walk').style.display = 'block';
                                document.getElementById('btn-walk').onclick = initGame;
                            } else {
                                document.getElementById('msg-toast').innerText = 'เดินมาถึงด่านต่อไปแล้ว ก้าวต่อไปเลย!';
                                document.getElementById('btn-walk').style.display = 'block';
                                isMoving = false;
                            }
                        }, 500);
                    }, 800);

                } else {
                    // เปลี่ยนประตูเป็นกับดัก
                    hp--;
                    updateUI();
                    blockEl.innerText = '💀';
                    blockEl.className = 'block dead';

                    document.getElementById('msg-toast').innerText = '❌ ผิดทาง! ถอยกลับไปตั้งหลัก';
                    document.getElementById('msg-toast').style.color = '#C53030';
                    
                    if(hp <= 0) {
                        document.getElementById('msg-toast').innerText = '💀 พลังชีวิตหมด! เกมโอเวอร์';
                        gameActive = false;
                        document.getElementById('btn-walk').innerText = 'ลองใหม่อีกครั้ง';
                        document.getElementById('btn-walk').style.display = 'block';
                        document.getElementById('btn-walk').onclick = initGame;
                    } else {
                        // หน่วงเวลาให้เห็นหัวกะโหลกแป๊บสั้นๆ แล้วเด้งกลับไปที่เดิม
                        setTimeout(() => {
                            const qRow = (currentStage === 0) ? 5 : (currentStage === 1) ? 3 : 1;
                            setPlayerPos(qRow, 1);
                            document.getElementById('msg-toast').innerText = 'ลองเลือกทางใหม่อีกครั้ง...';
                            
                            // เปิดคำถามเดิมให้แก้ตัว
                            setTimeout(() => { showQuestion(); }, 600);
                        }, 1000);
                    }
                }
            }, 600); // รอ animation ตัวละครเดินไปถึงประตูก่อน
        }

        window.addEventListener('DOMContentLoaded', initGame);
    </script>
</body>
</html>
